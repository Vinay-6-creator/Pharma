<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quiz - PharmaConnect AI</title>
    <style>
        :root{--bg:#081126;--panel:#121b34;--text:#eef2ff;--muted:#9bb0d5;--accent:#7ce1ff}
        body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#06101f 0%,#081126 100%);color:var(--text);padding:28px}
        a.back{color:var(--accent);text-decoration:none}
        .panel{background:var(--panel);padding:20px;border-radius:12px;border:1px solid rgba(255,255,255,.06)}
        .list{display:grid;gap:12px;margin-top:12px}
        .item{padding:12px;border-radius:8px;background:rgba(255,255,255,.02);display:flex;justify-content:space-between;align-items:center}
        button{padding:8px 12px;border-radius:8px;border:none;background:linear-gradient(90deg,#6b76ff,#5d7dff);color:#fff;cursor:pointer}
    </style>
</head>
<body>
    <div style="margin-bottom:12px">
        <a href="student-dashboard.html" class="back">← Back to Dashboard</a>
        <h1 style="margin:6px 0 0">Quiz</h1>
        <small style="color:var(--muted)">Practice quizzes and timed tests</small>
    </div>
    <section class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center">
            <strong>Available Quizzes</strong>
            <button onclick="addQuiz()">Add Demo Quiz</button>
        </div>
        <div id="quizList" class="list"></div>
    </section>
    <script>
        const quizKey='quiz_demo';
        function render(){
            const list=document.getElementById('quizList');
            const items=JSON.parse(localStorage.getItem(quizKey) || '[]');
            list.innerHTML='';
            if(items.length===0){ list.innerHTML='<div style="color:var(--muted)">No quizzes yet — add a demo quiz.</div>'; return; }
            items.forEach((q,idx)=>{
                const el=document.createElement('div'); el.className='item';
                el.innerHTML='<div><strong>'+q.title+'</strong><div style="color:var(--muted);font-size:0.9rem">'+q.meta+'</div></div>';
                const btn=document.createElement('button'); btn.textContent='Start'; btn.onclick=()=>startQuiz(idx);
                el.appendChild(btn); list.appendChild(el);
            });
        }
        function addQuiz(){
            const items=JSON.parse(localStorage.getItem(quizKey) || '[]');
            items.unshift({title:'Demo Anatomy Quiz', meta:'10 questions • 10 mins', created:Date.now()});
            localStorage.setItem(quizKey, JSON.stringify(items)); render();
        }
        function startQuiz(i){ alert('Starting quiz #' + (i+1) + ' (demo)'); }
        render();
    </script>
</body>
</html>

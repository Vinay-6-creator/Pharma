<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Assignments - PharmaConnect AI</title>
    <style>
        :root{--bg:#081126;--panel:#121b34;--text:#eef2ff;--muted:#9bb0d5;--accent:#7ce1ff}
        body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#06101f 0%,#081126 100%);color:var(--text);padding:28px}
        a.back{color:var(--accent);text-decoration:none}
        .panel{background:var(--panel);padding:20px;border-radius:12px;border:1px solid rgba(255,255,255,.06)}
        .list{display:grid;gap:12px;margin-top:12px}
        .item{padding:12px;border-radius:8px;background:rgba(255,255,255,.02);display:flex;justify-content:space-between;align-items:center}
        button{padding:8px 12px;border-radius:8px;border:none;background:linear-gradient(90deg,#6b76ff,#5d7dff);color:#fff;cursor:pointer}
        input[type=file]{display:none}
    </style>
</head>
<body>
    <div style="margin-bottom:12px">
        <a href="student-dashboard.html" class="back">← Back to Dashboard</a>
        <h1 style="margin:6px 0 0">My Assignments</h1>
        <small style="color:var(--muted)">Submit and view assignment status</small>
    </div>
    <section class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center">
            <strong>Pending Assignments</strong>
            <button onclick="addAssignment()">Add Demo Assignment</button>
        </div>
        <div id="assignList" class="list"></div>
    </section>
    <script>
        const assignKey='assign_demo';
        function render(){
            const list=document.getElementById('assignList');
            const items=JSON.parse(localStorage.getItem(assignKey)||'[]');
            list.innerHTML='';
            if(items.length===0){ list.innerHTML='<div style="color:var(--muted)">No assignments yet — add a demo.</div>'; return; }
            items.forEach((a,idx)=>{
                const el=document.createElement('div'); el.className='item';
                el.innerHTML='<div><strong>'+a.title+'</strong><div style="color:var(--muted);font-size:0.9rem">Due: '+new Date(a.due).toLocaleDateString()+'</div></div>';
                const upload=document.createElement('button'); upload.textContent='Upload'; upload.onclick=()=>uploadFile(idx);
                el.appendChild(upload); list.appendChild(el);
            });
        }
        function addAssignment(){
            const items=JSON.parse(localStorage.getItem(assignKey)||'[]');
            items.unshift({title:'Demo Assignment 1', due:Date.now()+7*24*3600*1000});
            localStorage.setItem(assignKey, JSON.stringify(items)); render();
        }
        function uploadFile(i){
            const input=document.createElement('input'); input.type='file'; input.accept='application/pdf,image/*';
            input.onchange = e => { if(e.target.files && e.target.files[0]) alert('File "'+e.target.files[0].name+'" selected for assignment #' + (i+1)); };
            input.click();
        }
        render();
    </script>
</body>
</html>

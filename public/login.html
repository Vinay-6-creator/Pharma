<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaConnect AI - Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 8px; width: 350px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #334155; box-sizing: border-box; }
        input, select { background: #0f172a; color: #fff; }
        button { background: #059669; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #047857; }
        .link { text-align: center; display: block; margin-top: 10px; color: #94a3b8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form id="loginForm">
            <label for="role">Login As:</label>
            <select id="role" name="role" required>
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
            </select>

            <label for="email" style="display:none;">Email Address</label>
            <input type="email" id="email" placeholder="Email Address" required>

            <label for="password" style="display:none;">Password</label>
            <input type="password" id="password" placeholder="Password" required>
            
            <button type="submit">Login</button>
        </form>
        <p id="msg" style="color: #f87171; font-size: 14px; text-align: center;"></p>
        <a class="link" href="/register.html">Naya account banayein (Register)</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const role = document.getElementById('role').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, role })
            });

            const data = await res.json();
            if (res.ok) {
                window.location.href = data.redirectUrl;
            } else {
                msg.textContent = data.message;
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mock Tests - PharmaConnect AI</title>
    <style>
        :root{--bg:#081126;--panel:#121b34;--text:#eef2ff;--muted:#9bb0d5;--accent:#7ce1ff}
        body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#06101f 0%,#081126 100%);color:var(--text);padding:28px}
        a.back{color:var(--accent);text-decoration:none}
        .panel{background:var(--panel);padding:20px;border-radius:12px;border:1px solid rgba(255,255,255,.06)}
        button{padding:10px 14px;border-radius:10px;border:none;background:linear-gradient(90deg,#6b76ff,#5d7dff);color:#fff;cursor:pointer}
    </style>
</head>
<body>
    <div style="margin-bottom:12px">
        <a href="student-dashboard.html" class="back">← Back to Dashboard</a>
        <h1 style="margin:6px 0 0">Mock Tests</h1>
        <small style="color:var(--muted)">Full-length timed mock exams</small>
    </div>
    <section class="panel">
        <p>Start a mock test to simulate exam conditions.</p>
        <div style="display:flex;gap:10px;margin-top:12px">
            <button onclick="startMock('50 Q - 60 mins')">50 Questions • 60 mins</button>
            <button onclick="startMock('100 Q - 120 mins')">100 Questions • 120 mins</button>
        </div>
    </section>
    <script>
        function startMock(label){
            alert('Starting mock: ' + label + ' (demo)');
        }
    </script>
</body>
</html>
